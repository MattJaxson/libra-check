[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-check"
version = "0.2.0"
description = "Impact ratios with uncertainty, three-state classification and parameter provenance (LARS v0.1)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Matthew Jackson", email = "majackson1015@gmail.com"}]
keywords = ["fairness", "bias audit", "impact ratio", "four-fifths rule", "NYC Local Law 144", "confidence interval", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/MattJaxson/libra-check"
Specification = "https://github.com/MattJaxson/libra-check/tree/main/spec"

[project.optional-dependencies]
test = ["pytest>=7", "statsmodels>=0.14", "jsonschema>=4.18", "pandas>=2"]
schema = ["jsonschema>=4.18"]

[project.scripts]
libra-check = "libra_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libra_check = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
